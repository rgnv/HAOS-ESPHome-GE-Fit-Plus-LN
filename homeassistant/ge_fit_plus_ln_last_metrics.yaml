        state: "{{ states('input_text.ge_fit_plus_ln_last_impedance_6') }}"
        availability: "{{ is_number(states('input_text.ge_fit_plus_ln_last_impedance_6')) }}"
        unit_of_measurement: "Ω"
        state_class: measurement
      - name: GE Fit Plus LN Last Impedance 7
        unique_id: ge_fit_plus_ln_last_impedance_7
        state: "{{ states('input_text.ge_fit_plus_ln_last_impedance_7') }}"
