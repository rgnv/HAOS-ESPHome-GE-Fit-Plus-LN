      - name: GE Fit Plus LN Last Weight
        unique_id: ge_fit_plus_ln_last_weight
        state: "{{ states('input_text.ge_fit_plus_ln_last_weight_kg') }}"
        availability: "{{ is_number(states('input_text.ge_fit_plus_ln_last_weight_kg')) }}"
        unit_of_measurement: kg
        device_class: weight
        state_class: measurement
      - name: GE Fit Plus LN Last Weight (lb)
        unique_id: ge_fit_plus_ln_last_weight_lb
        state: "{{ states('input_text.ge_fit_plus_ln_last_weight_lb') }}"
        availability: "{{ is_number(states('input_text.ge_fit_plus_ln_last_weight_lb')) }}"
        unit_of_measurement: lb
        device_class: weight
