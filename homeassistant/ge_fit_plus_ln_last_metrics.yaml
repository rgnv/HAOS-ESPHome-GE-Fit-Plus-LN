# Persistent last-measurement mirrors for the GE Fit Plus LN.
# The ESPHome entities can go unavailable when the C6 turns Wi-Fi off; these
# helpers retain the last finalized values for the dashboard and reminder.

input_text:
  ge_fit_plus_ln_last_weight_kg:
    name: GE Fit Plus LN Last Weight (kg)
    max: 32
  ge_fit_plus_ln_last_weight_lb:
    name: GE Fit Plus LN Last Weight (lb)
    max: 32
  ge_fit_plus_ln_last_bmi:
    name: GE Fit Plus LN Last BMI
    max: 32
  ge_fit_plus_ln_last_body_fat:
    name: GE Fit Plus LN Last Body Fat
    max: 32
  ge_fit_plus_ln_last_body_water:
    name: GE Fit Plus LN Last Body Water
    max: 32
  ge_fit_plus_ln_last_protein:
    name: GE Fit Plus LN Last Protein
    max: 32
  ge_fit_plus_ln_last_bone_mass:
    name: GE Fit Plus LN Last Bone Mass
    max: 32
  ge_fit_plus_ln_last_muscle_mass:
    name: GE Fit Plus LN Last Muscle Mass
    max: 32
  ge_fit_plus_ln_last_skeletal_muscle:
    name: GE Fit Plus LN Last Skeletal Muscle
    max: 32
  ge_fit_plus_ln_last_fat_free_mass:
    name: GE Fit Plus LN Last Fat Free Mass
    max: 32
  ge_fit_plus_ln_last_whole_body_impedance:
    name: GE Fit Plus LN Last Whole Body Impedance
    max: 32
  ge_fit_plus_ln_last_impedance_1:
    name: GE Fit Plus LN Last Impedance 1
    max: 32
  ge_fit_plus_ln_last_impedance_2:
    name: GE Fit Plus LN Last Impedance 2
    max: 32
  ge_fit_plus_ln_last_impedance_3:
    name: GE Fit Plus LN Last Impedance 3
    max: 32
  ge_fit_plus_ln_last_impedance_4:
    name: GE Fit Plus LN Last Impedance 4
    max: 32
  ge_fit_plus_ln_last_impedance_5:
    name: GE Fit Plus LN Last Impedance 5
    max: 32
  ge_fit_plus_ln_last_impedance_6:
    name: GE Fit Plus LN Last Impedance 6
    max: 32
  ge_fit_plus_ln_last_impedance_7:
    name: GE Fit Plus LN Last Impedance 7
    max: 32
  ge_fit_plus_ln_last_impedance_8:
    name: GE Fit Plus LN Last Impedance 8
    max: 32
  ge_fit_plus_ln_last_source:
    name: GE Fit Plus LN Last Measurement Source
    max: 32
  ge_fit_plus_ln_last_subject:
    name: GE Fit Plus LN Last Measurement Subject
    max: 32
  ge_fit_plus_ln_last_measurement_id:
