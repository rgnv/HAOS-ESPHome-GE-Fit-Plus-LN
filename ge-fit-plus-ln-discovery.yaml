substitutions:
  device_name: ge-fit-plus-ln-discovery
  friendly_name: GE Fit Plus LN Discovery

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: rgnv.ge_fit_plus_ln_discovery
    version: "0.1.0"
  comment: "Temporary BLE discovery firmware for GE Fit Plus LN"

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:
  level: VERY_VERBOSE

api:
  encryption:
    key: !secret ge_scale_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ge_scale_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "GE Fit Plus LN Discovery Setup"
    password: !secret ge_scale_ap_password

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    active: true
    continuous: true
    interval: 320ms
    window: 320ms
