automation:
  - id: ge_fit_plus_ln_snapshot_last_metrics
    alias: GE Fit Plus LN - remember last recorded metrics
    description: Persist the latest finalized scale metrics while the C6 may be offline.
    mode: queued
    trigger:
      - platform: state
        entity_id: sensor.ge_fit_plus_ln_weight
        for: "00:00:05"
      - platform: state
        entity_id: sensor.ge_fit_plus_ln_measurement_id
    condition:
      - condition: template
        value_template: >-
          {{ trigger.to_state is not none and is_number(trigger.to_state.state) }}
    action:
      - repeat:
          for_each:
            - helper: input_text.ge_fit_plus_ln_last_weight_kg
              source: sensor.ge_fit_plus_ln_weight
            - helper: input_text.ge_fit_plus_ln_last_weight_lb
              source: sensor.ge_fit_plus_ln_weight_lb
            - helper: input_text.ge_fit_plus_ln_last_bmi
              source: sensor.ge_fit_plus_ln_bmi
            - helper: input_text.ge_fit_plus_ln_last_body_fat
              source: sensor.ge_fit_plus_ln_body_fat
            - helper: input_text.ge_fit_plus_ln_last_body_water
              source: sensor.ge_fit_plus_ln_body_water
            - helper: input_text.ge_fit_plus_ln_last_protein
              source: sensor.ge_fit_plus_ln_protein
            - helper: input_text.ge_fit_plus_ln_last_bone_mass
              source: sensor.ge_fit_plus_ln_bone_mass
            - helper: input_text.ge_fit_plus_ln_last_muscle_mass
              source: sensor.ge_fit_plus_ln_muscle_mass
            - helper: input_text.ge_fit_plus_ln_last_skeletal_muscle
              source: sensor.ge_fit_plus_ln_skeletal_muscle
            - helper: input_text.ge_fit_plus_ln_last_fat_free_mass
              source: sensor.ge_fit_plus_ln_fat_free_mass
            - helper: input_text.ge_fit_plus_ln_last_whole_body_impedance
              source: sensor.ge_fit_plus_ln_whole_body_impedance
            - helper: input_text.ge_fit_plus_ln_last_impedance_1
              source: sensor.ge_fit_plus_ln_impedance_1
            - helper: input_text.ge_fit_plus_ln_last_impedance_2
              source: sensor.ge_fit_plus_ln_impedance_2
            - helper: input_text.ge_fit_plus_ln_last_impedance_3
              source: sensor.ge_fit_plus_ln_impedance_3
            - helper: input_text.ge_fit_plus_ln_last_impedance_4
              source: sensor.ge_fit_plus_ln_impedance_4
            - helper: input_text.ge_fit_plus_ln_last_impedance_5
              source: sensor.ge_fit_plus_ln_impedance_5
            - helper: input_text.ge_fit_plus_ln_last_impedance_6
              source: sensor.ge_fit_plus_ln_impedance_6
            - helper: input_text.ge_fit_plus_ln_last_impedance_7
              source: sensor.ge_fit_plus_ln_impedance_7
            - helper: input_text.ge_fit_plus_ln_last_impedance_8
              source: sensor.ge_fit_plus_ln_impedance_8
          sequence:
            - service: input_text.set_value
              target:
                entity_id: "{{ repeat.item.helper }}"
              data:
                value: "{{ states(repeat.item.source) }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.ge_fit_plus_ln_last_source
        data:
          value: "{{ states('sensor.ge_fit_plus_ln_measurement_source') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.ge_fit_plus_ln_last_subject
        data:
          value: "{{ states('sensor.ge_fit_plus_ln_subject') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.ge_fit_plus_ln_last_measurement_id
        data:
          value: "{{ states('sensor.ge_fit_plus_ln_measurement_id') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.ge_fit_plus_ln_last_recorded_at
        data:
          value: "{{ now().isoformat() }}"
      - service: persistent_notification.dismiss
        data:
          notification_id: ge_fit_plus_ln_daily_reminder

  - id: ge_fit_plus_ln_daily_weigh_in_reminder
    alias: GE Fit Plus LN - 9 PM weigh-in reminder
    description: Remind at 9 PM local time when no finalized weigh-in was recorded today.
    mode: single
    trigger:
      - platform: time
        at: "21:00:00"
    condition:
      - condition: template
        value_template: >-
          {% set recorded = states('input_text.ge_fit_plus_ln_last_recorded_at') %}
          {% set recorded_at = as_datetime(recorded, default=none) %}
          {{ recorded_at is none or as_local(recorded_at).date() != now().date() }}
    action:
      - service: persistent_notification.create
        data:
          notification_id: ge_fit_plus_ln_daily_reminder
          title: GE Fit Plus LN reminder
          message: You have not recorded a weigh-in today.
      - service: notify.mobile_app_red
        data:
          title: GE Fit Plus LN reminder
          message: You have not recorded a weigh-in today.
      - service: notify.mobile_app_pixel_watch_5
        data:
          title: GE Fit Plus LN reminder
          message: You have not recorded a weigh-in today.
