substitutions:
  device_name: ge-fit-plus-ln
  friendly_name: GE Fit Plus LN

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: rgnv.ge_fit_plus_ln
    version: "0.1.0"
  comment: "GE Fit Plus LN body scale BLE bridge"

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  deassert_rts_dtr: true

api:
  encryption:
    key: !secret ge_scale_api_key
  reboot_timeout: 0s
  # Preserve metric/state publication order before the measurement ID trigger.
  batch_delay: 0ms
  actions:
    # Explicit recovery only: inspect oldest record before discarding its exact record_id.
    - action: discard_recording
      variables:
        record_id: string
      then:
        - lambda: id(ge_fit_plus_ln_data).discard_recording(record_id);

ota:
  - platform: esphome
    password: !secret ge_scale_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: false
  power_save_mode: none
  post_connect_roaming: false
  reboot_timeout: 0s
  ap:
    ssid: "GE Fit Plus LN Setup"
    password: !secret ge_scale_ap_password

captive_portal:

time:
  - platform: sntp
    id: ge_scale_time

external_components:
  - source:
      type: local
      path: components
    components: [ge_scale]

esp32_ble_tracker:
  scan_parameters:
    continuous: true
    # Match the known address from ADV_IND itself. IDF active scanning otherwise
    # withholds it until SCAN_RSP, which a weak/intermittent peripheral may miss.
    active: false
  on_ble_advertise:
    - mac_address: !secret ge_scale_mac
      then:
        - lambda: |-
            ESP_LOGI("ge_scale", "Target advertisement: addr_type=%u rssi=%d client_state=%u",
                     static_cast<unsigned>(x.get_address_type()), x.get_rssi(),
                     static_cast<unsigned>(id(ge_scale_client).state()));

ble_client:
  - mac_address: !secret ge_scale_mac
    id: ge_scale_client
    auto_connect: true

ge_scale:
  id: ge_fit_plus_ln_data
  ble_client_id: ge_scale_client
  recording_capacity: 16

  # Keep personal profile data in secrets.yaml; it is required for BIA calculations.
  height: !secret ge_scale_height_m
  sex: !secret ge_scale_sex
  birthday: !secret ge_scale_birthday
  age: !secret ge_scale_age

  # Guest filtering is intentionally disabled until multi-user handling is designed.
  filter_guests: false
  write_back: !secret ge_scale_write_back
  time_id: ge_scale_time

  weight:
    name: "GE Fit Plus LN Weight"
    id: ge_scale_weight
  weight_lb:
    name: "GE Fit Plus LN Weight (lb)"
    id: ge_scale_weight_lb
  bmi:
    name: "GE Fit Plus LN BMI"
    id: ge_scale_bmi
  measurement_id:
    name: "GE Fit Plus LN Measurement ID"
    id: ge_scale_measurement_id
  body_fat_percent:
    name: "GE Fit Plus LN Body Fat"
    id: ge_scale_body_fat
  body_water_percent:
    name: "GE Fit Plus LN Body Water"
    id: ge_scale_body_water
  protein_percent:
    name: "GE Fit Plus LN Protein"
    id: ge_scale_protein
  bone_mass_percent:
    name: "GE Fit Plus LN Bone Mass"
    id: ge_scale_bone_mass
  muscle_mass_percent:
    name: "GE Fit Plus LN Muscle Mass"
    id: ge_scale_muscle_mass
  skeletal_muscle_percent:
    name: "GE Fit Plus LN Skeletal Muscle"
    id: ge_scale_skeletal_muscle
  fat_free_mass:
    name: "GE Fit Plus LN Fat Free Mass"
    id: ge_scale_fat_free_mass
  whole_body_impedance:
    name: "GE Fit Plus LN Whole Body Impedance"
    id: ge_scale_impedance
  impedance_1:
    name: "GE Fit Plus LN Impedance 1"
    id: ge_scale_impedance_1
  impedance_2:
    name: "GE Fit Plus LN Impedance 2"
    id: ge_scale_impedance_2
  impedance_3:
    name: "GE Fit Plus LN Impedance 3"
    id: ge_scale_impedance_3
  impedance_4:
    name: "GE Fit Plus LN Impedance 4"
    id: ge_scale_impedance_4
  impedance_5:
    name: "GE Fit Plus LN Impedance 5"
    id: ge_scale_impedance_5
  impedance_6:
    name: "GE Fit Plus LN Impedance 6"
    id: ge_scale_impedance_6
  impedance_7:
    name: "GE Fit Plus LN Impedance 7"
    id: ge_scale_impedance_7
  impedance_8:
    name: "GE Fit Plus LN Impedance 8"
    id: ge_scale_impedance_8
  subject:
    name: "GE Fit Plus LN Subject"
    id: ge_scale_subject
  source:
    name: "GE Fit Plus LN Measurement Source"
    id: ge_scale_source
  is_guest:
    name: "GE Fit Plus LN Guest"
    id: ge_scale_is_guest

# Outbox health and oldest record ID; no health measurements or profile data.
sensor:
  - platform: template
    name: "GE Fit Plus LN Pending Recordings"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(ge_fit_plus_ln_data).pending_recordings();
binary_sensor:
  - platform: template
    name: "GE Fit Plus LN Recording Storage Healthy"
    entity_category: diagnostic
    lambda: return id(ge_fit_plus_ln_data).recording_storage_ok();

text_sensor:
  - platform: template
    name: "GE Fit Plus LN Oldest Recording"
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 30s
    lambda: return id(ge_fit_plus_ln_data).oldest_recording();
